<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>A float before a block that a top margin collapses through stays above that margin</title>
</head>
<body>

<div id="test-root" style="display: block; width: 400px;">
  <div style="display: block; float: right; width: 300px; height: 50px;"></div>
  <div style="display: block;">
    <div style="display: block; margin-top: 100px;">
      <div style="display: block; float: right; width: 50px; height: 20px;"></div>
    </div>
  </div>
</div>

</body>
</html>
